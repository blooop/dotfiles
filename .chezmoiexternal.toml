# Zellij WASM plugins.
#
# Fetched from upstream releases rather than vendored, so `chezmoi apply` stays
# the single source of truth on every machine and the binaries never enter Git.
#
# Pinned to versioned release paths with checksums, where these used to track
# releases/latest on a weekly refreshPeriod. These are executable code from four
# single-maintainer hobby repos, and `latest` meant every machine took whatever
# a release (or a compromised account) published, sight unseen, within a week —
# two of the five had already moved under `latest` with nothing here noticing.
# A tag is repointable, unlike a commit sha, which is why each pin carries a
# sha256: a repointed asset fails the apply instead of running.
#
# No refreshPeriod on a pinned URL: the content at it must never change, so a
# weekly re-download could only fetch identical bytes or a checksum failure.
#
# The bump ritual: read the upstream release notes (and ideally the diff since
# the pinned tag), then move the URL's tag and the sha256 together —
#   curl -fsSL <new url> | sha256sum
# A URL change is what makes chezmoi re-download; `chezmoi apply -R` re-verifies
# a cached copy by hand.
#
# Gated on .toolbox, which is where zellij itself now comes from: a container has
# no zellij to load them, and no download cache either, so all five were being
# re-fetched from GitHub — 8.4MB over the wire — on every single container create,
# to land plugins nothing would ever run. This file is template-processed by
# chezmoi like any other source file, so the gate needs no rename.
{{ if .toolbox -}}

[".config/zellij/plugins/zellij-autolock.wasm"]
type = "file"
url = "https://github.com/fresh2dev/zellij-autolock/releases/download/0.2.2/zellij-autolock.wasm"
checksum.sha256 = "69c95607bfd97e075d6762a44fdbc703a82a3c4909dbbbe43952f020487b8ea4"

[".config/zellij/plugins/zellij-attention.wasm"]
type = "file"
url = "https://github.com/KiryuuLight/zellij-attention/releases/download/v0.3.1/zellij-attention.wasm"
checksum.sha256 = "4209337ab61a731448ec733362f3ef699a905bbb5c0112a93a6d616360fd722f"

[".config/zellij/plugins/zellij-leap.wasm"]
type = "file"
url = "https://github.com/Picalines/zellij-leap/releases/download/v0.5.0/zellij-leap.wasm"
checksum.sha256 = "1b266246a7097e9d7bfa20ce343ab40c349267d02adac3adee812ddae8d97870"

[".config/zellij/plugins/zjstatus.wasm"]
type = "file"
url = "https://github.com/dj95/zjstatus/releases/download/v0.25.0/zjstatus.wasm"
checksum.sha256 = "282ceab219e56e1908c9fac33907241fe6c3e1ef7d85faab3e5f438cef87b8fe"

# The README documents building from source, but releases do ship a wasm asset.
[".config/zellij/plugins/zj-which-key.wasm"]
type = "file"
url = "https://github.com/johnae/zj-which-key/releases/download/v0.2.0/zj_which_key.wasm"
checksum.sha256 = "1e2edc386212ea05881399a8d06720603891ffe0a7c53ab5a6b30f26fc9fc9fb"
{{- end }}

# Matt Pocock's skills (github.com/mattpocock/skills), consumed as files rather
# than as the Claude Code plugin, so they can be curated: this machine takes 21
# of his 25 promoted skills. The four skipped ones would collide -- `wayfinder`,
# `to-tickets`, `to-spec` and `implement` duplicate the wf map spine, and his
# `code-review` collides by name with Claude Code's built-in.
#
# One archive external per skill, extracted straight to its final path in
# ~/.claude/skills. They were briefly a single `git-repo` clone plus a script that
# symlinked each skill out of it, which cost more than it looked like: the clone
# was a second copy of every skill, a skill deleted from this list left a real
# directory that the link script then refused to clobber -- so the orphan blocked
# its own replacement -- and cleaning those orphans up needed `.chezmoiremove`
# entries individually guarded against deleting the very symlinks the script had
# just made. None of that exists here. Each skill is an ordinary managed path, and
# chezmoi replaces whatever is sitting there, symlink or directory, with no help.
#
# `include` matches the paths inside the tarball, so it is written against the
# archive's own layout (a `skills-<ref>/` top directory, hence the leading `*/`),
# while stripComponents = 4 discards `skills-<ref>/skills/<bucket>/<name>/` so the
# files land at the root of the target. That is what flattens upstream's bucket
# directories away: `engineering/tdd/SKILL.md` becomes `skills/tdd/SKILL.md`.
#
# All 21 name the same tarball, which is downloaded and cached once rather than
# 21 times -- a warm apply re-extracts from the cache in about 30ms.
#
# Pinned to a commit sha, where this used to track refs/heads/main on a weekly
# refreshPeriod. These land in ~/.claude/skills -- the agent prompt surface --
# and tracking main meant every machine took whatever upstream merged, sight
# unseen, within a week. The sha-addressed archive is content-addressed, so no
# separate checksum is needed, and no refreshPeriod either: the URL's content
# cannot change, and a bump changes the URL, which is what makes chezmoi
# re-download. The bump ritual: in a clone of mattpocock/skills, read
#   git log <pinned sha>..origin/main -- skills/
# then move the sha and check the curated list below still matches the tree
# (a rename or removal upstream otherwise fails the apply).
#
# Gated on .claudecfg, not .toolbox: same reasoning as the wf link script. The
# flag means "chezmoi owns ~/.claude here", so where somebody else's bind mount
# owns it these 21 extractions would land on their files instead of ours.
#
# It used to say that was every container, because devlaunch bind-mounted the
# host's ~/.claude read-write. It does not and never did; `claudecfg` now reads
# the mount table instead of the profile name, so a container with a config dir
# of its own gets these skills and one whose repo mounted the host's does not.
# That is a change in what a fresh container costs: the tarball is downloaded
# once per refresh rather than 21 times, so it is one small archive of markdown
# per create, and in exchange the Claude running in a workspace has the same
# skills as the Claude that launched it -- which is the point of the workspace.
{{ if .claudecfg -}}
{{   $url := "https://github.com/mattpocock/skills/archive/6654f6b60cd9d5be8b54c6fafe44346dabeb3b76.tar.gz" -}}{{/* main as of 2026-08-24 */}}
{{   $skills := dict
       "engineering" (list "ask-matt" "codebase-design" "diagnosing-bugs"
                           "domain-modeling" "grill-with-docs"
                           "improve-codebase-architecture" "prototype" "research"
                           "resolving-merge-conflicts" "setup-matt-pocock-skills"
                           "tdd" "triage" "wizard")
       "productivity" (list "grill-me" "grilling" "handoff" "teach"
                            "to-questionnaire" "wait-what" "writing-for-agents")
       "misc"         (list "git-guardrails-claude-code") -}}
{{   range $bucket, $names := $skills }}
{{-    range $names }}
[".claude/skills/{{ . }}"]
type = "archive"
url = "{{ $url }}"
include = ["*/skills/{{ $bucket }}/{{ . }}/**"]
stripComponents = 4
{{ end -}}
{{   end -}}
{{ end -}}
