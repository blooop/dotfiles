# Zellij WASM plugins.
#
# Fetched from upstream releases rather than vendored, so `chezmoi apply` stays
# the single source of truth on every machine and the binaries never enter Git.
# refreshPeriod keeps a normal apply offline-friendly; `chezmoi apply -R` forces
# a re-download.
#
# Gated on .toolbox, which is where zellij itself now comes from: a container has
# no zellij to load them, and no download cache either, so all five were being
# re-fetched from GitHub — 8.4MB over the wire — on every single container create,
# to land plugins nothing would ever run. This file is template-processed by
# chezmoi like any other source file, so the gate needs no rename.
{{ if .toolbox -}}

[".config/zellij/plugins/zellij-autolock.wasm"]
type = "file"
url = "https://github.com/fresh2dev/zellij-autolock/releases/latest/download/zellij-autolock.wasm"
refreshPeriod = "168h"

[".config/zellij/plugins/zellij-attention.wasm"]
type = "file"
url = "https://github.com/KiryuuLight/zellij-attention/releases/latest/download/zellij-attention.wasm"
refreshPeriod = "168h"

[".config/zellij/plugins/zellij-leap.wasm"]
type = "file"
url = "https://github.com/Picalines/zellij-leap/releases/latest/download/zellij-leap.wasm"
refreshPeriod = "168h"

[".config/zellij/plugins/zjstatus.wasm"]
type = "file"
url = "https://github.com/dj95/zjstatus/releases/latest/download/zjstatus.wasm"
refreshPeriod = "168h"

# The README documents building from source, but releases do ship a wasm asset.
[".config/zellij/plugins/zj-which-key.wasm"]
type = "file"
url = "https://github.com/johnae/zj-which-key/releases/latest/download/zj_which_key.wasm"
refreshPeriod = "168h"
{{- end }}

# Matt Pocock's skills (github.com/mattpocock/skills), consumed as files rather
# than as the Claude Code plugin, so they can be curated: this machine takes 21
# of his 25 promoted skills. The four skipped ones would collide -- `wayfinder`,
# `to-tickets`, `to-spec` and `implement` duplicate the wf map spine, and his
# `code-review` collides by name with Claude Code's built-in.
#
# One archive external per skill, extracted straight to its final path in
# ~/.claude/skills. They were briefly a single `git-repo` clone plus a script that
# symlinked each skill out of it, which cost more than it looked like: the clone
# was a second copy of every skill, a skill deleted from this list left a real
# directory that the link script then refused to clobber -- so the orphan blocked
# its own replacement -- and cleaning those orphans up needed `.chezmoiremove`
# entries individually guarded against deleting the very symlinks the script had
# just made. None of that exists here. Each skill is an ordinary managed path, and
# chezmoi replaces whatever is sitting there, symlink or directory, with no help.
#
# `include` matches the paths inside the tarball, so it is written against the
# archive's own layout (a `skills-<ref>/` top directory, hence the leading `*/`),
# while stripComponents = 4 discards `skills-<ref>/skills/<bucket>/<name>/` so the
# files land at the root of the target. That is what flattens upstream's bucket
# directories away: `engineering/tdd/SKILL.md` becomes `skills/tdd/SKILL.md`.
#
# All 21 name the same tarball, which is downloaded and cached once per refresh
# rather than 21 times -- a warm apply re-extracts from the cache in about 30ms.
#
# Gated on .claudecfg, not .toolbox: same reasoning as the wf link script. In a
# container devlaunch bind-mounts the *host's* ~/.claude read-write, so writing
# skills from inside would write container paths onto the host.
{{ if .claudecfg -}}
{{   $url := "https://github.com/mattpocock/skills/archive/refs/heads/main.tar.gz" -}}
{{   $skills := dict
       "engineering" (list "ask-matt" "codebase-design" "diagnosing-bugs"
                           "domain-modeling" "grill-with-docs"
                           "improve-codebase-architecture" "prototype" "research"
                           "resolving-merge-conflicts" "setup-matt-pocock-skills"
                           "tdd" "triage" "wizard")
       "productivity" (list "grill-me" "grilling" "handoff" "teach"
                            "to-questionnaire" "wait-what" "writing-for-agents")
       "misc"         (list "git-guardrails-claude-code") -}}
{{   range $bucket, $names := $skills }}
{{-    range $names }}
[".claude/skills/{{ . }}"]
type = "archive"
url = "{{ $url }}"
include = ["*/skills/{{ $bucket }}/{{ . }}/**"]
stripComponents = 4
refreshPeriod = "168h"
{{ end -}}
{{   end -}}
{{ end -}}
